services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: talknex-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - apps/web/.env
    environment:
      - NODE_ENV=production
      - PORT=3000

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: talknex-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
