version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: talknex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talknex_user
      POSTGRES_PASSWORD: talknex_secret
      POSTGRES_DB: talknex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talknex_user -d talknex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talknex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: talknex-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://talknex_user:talknex_secret@postgres:5432/talknex_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000,https://talknex.com
    ports:
      - "4000:4000"

  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: talknex-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://talknex.com
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:

